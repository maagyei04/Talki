<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talki AI – Support</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      background: #fafafa;
      line-height: 1.6;
    }
    .container {
      max-width: 600px;
      margin: 80px auto;
      padding: 40px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      text-align: center;
    }
    h1 { color: #420080; margin-bottom: 16px; }
    p { color: #595959; margin-bottom: 32px; font-size: 16px; }
    .email-box {
      display: inline-block;
      background: #f4f0ff;
      color: #420080;
      padding: 16px 32px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      margin-bottom: 32px;
    }
    .footer {
      margin-top: 40px;
      font-size: 14px;
      color: #999;
    }
    .footer a { color: #420080; text-decoration: none; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Talki Support</h1>
    <p>Need help with the Talki app? Experiencing a bug, or have a question about your Talki Premium subscription? Our support team is here for you.</p>
    
    <a href="mailto:talkiAI.app@gmail.com" class="email-box">talkiAI.app@gmail.com</a>
